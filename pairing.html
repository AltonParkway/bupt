<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>圣诞礼物交换配对器</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 48px 24px;
        background:
          radial-gradient(circle at 15% 20%, rgba(248, 113, 113, 0.28), transparent 52%),
          radial-gradient(circle at 85% 15%, rgba(74, 222, 128, 0.35), transparent 53%),
          radial-gradient(circle at 50% 85%, rgba(234, 179, 8, 0.22), transparent 55%),
          linear-gradient(135deg, #fff5eb 0%, #fff1f2 45%, #f0fdf4 100%);
        color: #0f172a;
      }

      .card {
        width: min(960px, 100%);
        background: rgba(255, 255, 255, 0.9);
        border-radius: 32px;
        padding: 40px 36px;
        box-shadow: 0 48px 90px rgba(153, 27, 27, 0.16);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(248, 113, 113, 0.25);
        position: relative;
        animation: floatIn 0.5s ease;
      }

      .card::before,
      .card::after {
        content: "";
        position: absolute;
        inset: -18px;
        border-radius: 40px;
        background: conic-gradient(from 90deg, rgba(252, 165, 165, 0.08), transparent, rgba(74, 222, 128, 0.08));
        z-index: -1;
      }

      .card__header {
        text-align: center;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(1.9rem, 4.4vw, 2.6rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #b91c1c;
        text-shadow: 0 12px 28px rgba(220, 38, 38, 0.18);
      }

      .subtitle {
        margin: 0;
        color: #b2431b;
        font-size: 1.05rem;
      }

      label {
        display: block;
        font-weight: 600;
        color: #b45309;
        margin-bottom: 12px;
      }

      textarea {
        width: 100%;
        min-height: 150px;
        padding: 18px;
        border-radius: 18px;
        border: 1px solid rgba(248, 113, 113, 0.35);
        font-size: 1rem;
        resize: vertical;
        outline: none;
        background: rgba(255, 248, 237, 0.85);
        transition: border 0.2s ease, box-shadow 0.2s ease;
      }

      textarea:focus {
        border-color: rgba(220, 38, 38, 0.8);
        box-shadow: 0 0 0 5px rgba(220, 38, 38, 0.18);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }

      button {
        cursor: pointer;
        border: none;
        border-radius: 999px;
        padding: 14px 26px;
        font-size: 1rem;
        font-weight: 600;
        transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      #generate-button {
        background: linear-gradient(115deg, #ef4444 0%, #b91c1c 100%);
        color: #fff;
        box-shadow: 0 22px 38px rgba(185, 28, 28, 0.32);
      }

      #generate-button:hover {
        transform: translateY(-1px);
        box-shadow: 0 26px 44px rgba(185, 28, 28, 0.28);
        filter: brightness(1.04);
      }

      #download-button {
        background: rgba(34, 197, 94, 0.16);
        color: #047857;
        border: 1px solid rgba(34, 197, 94, 0.4);
      }

      #download-button:disabled,
      #export-button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        box-shadow: none;
      }

      #download-button:not(:disabled):hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 32px rgba(34, 197, 94, 0.24);
      }

      #export-button {
        background: rgba(251, 191, 36, 0.22);
        color: #b45309;
        border: 1px solid rgba(251, 191, 36, 0.42);
      }

      #export-button:not(:disabled):hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 28px rgba(217, 119, 6, 0.2);
      }

      #message {
        margin-top: 20px;
        min-height: 20px;
      }

      .error {
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid rgba(248, 113, 113, 0.35);
        background: rgba(254, 226, 226, 0.8);
        color: #b91c1c;
      }

      .result,
      .diagram {
        margin-top: 36px;
        animation: fadeUp 0.4s ease;
      }

      .result h2,
      .diagram h2 {
        margin: 0 0 18px;
        font-size: 1.25rem;
        color: #9a3412;
        text-align: center;
      }

      .pairs {
        display: grid;
        gap: 14px;
      }

      .pair {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 20px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(254, 226, 226, 0.92), rgba(220, 252, 231, 0.88));
        border: 1px solid rgba(248, 113, 113, 0.45);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .name {
        flex: 1;
        font-weight: 600;
        color: #7f1d1d;
        text-align: center;
      }

      .arrow {
        font-size: 1.4rem;
        color: #15803d;
      }

      .diagram canvas {
        display: block;
        width: min(620px, 100%);
        height: auto;
        border-radius: 22px;
        background: rgba(255, 247, 237, 0.72);
        border: 1px solid rgba(248, 113, 113, 0.25);
        box-shadow: 0 28px 54px rgba(185, 28, 28, 0.18);
        margin: 0 auto;
      }

      .diagram__hint {
        margin-top: 14px;
        text-align: center;
        color: #9f1239;
        font-size: 0.95rem;
      }

      @keyframes floatIn {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 720px) {
        body {
          padding: 32px 16px;
        }

        .card {
          padding: 30px 22px;
          border-radius: 26px;
        }

        .controls {
          flex-direction: column;
          align-items: stretch;
        }

        button {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header class="card__header">
        <h1>🎄 圣诞礼物交换配对器</h1>
        <p class="subtitle">准备好礼物，只需一步抽出你的圣诞惊喜伙伴</p>
      </header>

      <section>
        <label for="names-input">圣诞小伙伴名单（用逗号、顿号或换行分隔）</label>
        <textarea
          id="names-input"
          placeholder="例如：圣诞老人，驯鹿，雪橇手，精灵一号，精灵二号"
        ></textarea>
        <div class="controls">
          <button id="generate-button" type="button" aria-label="生成配对">
            <span>🎅 生成礼物配对</span>
          </button>
          <button id="download-button" type="button" disabled aria-label="下载配对图">
            <span>🎁 下载圣诞配对图</span>
          </button>
          <button id="export-button" type="button" disabled aria-label="导出礼物清单">
            <span>📝 导出礼物清单</span>
          </button>
        </div>
      </section>

      <div id="message"></div>

      <section id="result" class="result" hidden aria-live="polite">
        <h2>🎁 礼物指派清单</h2>
        <div id="pairs" class="pairs"></div>
      </section>

      <section id="diagram" class="diagram" hidden>
        <h2>🎨 圣诞箭头图</h2>
        <canvas id="diagram-canvas" width="620" height="620" role="img" aria-label="配对箭头图"></canvas>
        <p class="diagram__hint">保存后分享给大家，让圣诞礼物交换更有仪式感！</p>
      </section>
    </main>
    <script>
      const input = document.getElementById("names-input");
      const button = document.getElementById("generate-button");
      const downloadButton = document.getElementById("download-button");
      const exportButton = document.getElementById("export-button");
      const message = document.getElementById("message");
      const resultSection = document.getElementById("result");
      const pairsContainer = document.getElementById("pairs");
      const diagramSection = document.getElementById("diagram");
      const diagramCanvas = document.getElementById("diagram-canvas");
      let latestDiagramDataUrl = "";
      let latestPairList = [];

      function parseNames(raw) {
        return raw
          .split(/[\n,;；,，、]+/)
          .map((name) => name.trim())
          .filter(Boolean);
      }

      function unique(names) {
        return Array.from(new Set(names));
      }

      function shuffle(array) {
        const result = array.slice();
        for (let i = result.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      function generatePermutation(size) {
        const order = shuffle([...Array(size).keys()]);
        const mapping = new Array(size);

        for (let i = 0; i < size; i++) {
          const current = order[i];
          const next = order[(i + 1) % size];
          mapping[current] = next;
        }

        return mapping;
      }

      function getCycleOrder(mapping) {
        const visited = new Array(mapping.length).fill(false);
        const order = [];
        for (let start = 0; start < mapping.length; start++) {
          if (visited[start]) continue;
          let current = start;
          while (!visited[current]) {
            visited[current] = true;
            order.push(current);
            current = mapping[current];
          }
        }
        return order;
      }

      function renderPairs(names, mapping, order) {
        pairsContainer.innerHTML = "";
        order.forEach((sourceIndex, position) => {
          const targetIndex = mapping[sourceIndex];
          const pair = document.createElement("div");
          pair.className = "pair";

          const from = document.createElement("span");
          from.className = "name";
          from.textContent = names[sourceIndex];

          const arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.textContent = "→";

          const to = document.createElement("span");
          to.className = "name";
          to.textContent = names[targetIndex];

          pair.appendChild(from);
          pair.appendChild(arrow);
          pair.appendChild(to);
          pairsContainer.appendChild(pair);
        });
        resultSection.hidden = false;
      }

      function prepareCanvas() {
        const ctx = diagramCanvas.getContext("2d");
        const ratio = window.devicePixelRatio || 1;
        const available = Math.min(diagramSection.clientWidth || 620, 620);
        diagramCanvas.style.width = `${available}px`;
        diagramCanvas.style.height = `${available}px`;
        diagramCanvas.width = available * ratio;
        diagramCanvas.height = available * ratio;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        return { ctx, size: available };
      }

      function drawArrow(ctx, from, to, options = {}) {
        const { nodeRadius = 30, color = "#047857" } = options;
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const distance = Math.hypot(dx, dy);
        if (!distance) return;

        const ux = dx / distance;
        const uy = dy / distance;

        const startOffset = nodeRadius + 8;
        const endOffset = nodeRadius + 20;

        const startX = from.x + ux * startOffset;
        const startY = from.y + uy * startOffset;

        const endX = to.x - ux * endOffset;
        const endY = to.y - uy * endOffset;

        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.shadowColor = "rgba(45, 212, 191, 0.35)";
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = color;
        const headLength = Math.max(18, nodeRadius * 0.6);
        const baseAngle = Math.atan2(dy, dx);
        const headSpread = Math.PI / 6;
        const angle1 = baseAngle - headSpread;
        const angle2 = baseAngle + headSpread;

        ctx.save();
        ctx.shadowColor = "rgba(45, 212, 191, 0.25)";
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(
          endX - headLength * Math.cos(angle1),
          endY - headLength * Math.sin(angle1)
        );
        ctx.lineTo(
          endX - headLength * Math.cos(angle2),
          endY - headLength * Math.sin(angle2)
        );
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawNodes(ctx, nodes, options = {}) {
        const {
          nodeRadius = 30,
          fillColors = ["#fecdd3", "#fef3c7"],
          borderColor = "rgba(220, 38, 38, 0.45)",
        } = options;

        nodes.forEach((node) => {
          const gradient = ctx.createRadialGradient(
            node.x - 10,
            node.y - 12,
            8,
            node.x,
            node.y,
            nodeRadius * 1.15
          );
          gradient.addColorStop(0, fillColors[0]);
          gradient.addColorStop(1, fillColors[1]);

          ctx.beginPath();
          ctx.fillStyle = gradient;
          ctx.arc(node.x, node.y, nodeRadius, 0, Math.PI * 2);
          ctx.fill();

            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "#7f1d1d";
            const baseFontSize = node.name.length > 6 ? 14 : 16;
            ctx.font = `600 ${baseFontSize}px "Inter", "Noto Sans SC", system-ui`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(node.name, node.x, node.y);

            const badgeRadius = 14;
            const badgeDistance = nodeRadius + 28;
            const badgeX =
              node.x + Math.cos(node.angle) * badgeDistance;
            const badgeY =
              node.y + Math.sin(node.angle) * badgeDistance;

            ctx.beginPath();
            ctx.fillStyle = "#b91c1c";
            ctx.arc(badgeX, badgeY, badgeRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#fefce8";
            ctx.font = `600 13px "Inter", "Noto Sans SC", system-ui`;
            ctx.fillText(node.order.toString(), badgeX, badgeY);
        });
      }

      function drawDiagram(names, mapping, order) {
        const { ctx, size } = prepareCanvas();
        const center = size / 2;
        const radius = size / 2 - 90;
        const nodeRadius = Math.max(24, Math.min(32, size / 20));

        const bgGradient = ctx.createLinearGradient(0, 0, size, size);
        bgGradient.addColorStop(0, "#fee2e2");
        bgGradient.addColorStop(0.5, "#fef3c7");
        bgGradient.addColorStop(1, "#dcfce7");
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, size, size);

        const nodes = order.map((index, position) => {
          const angle = (Math.PI * 2 * position) / order.length - Math.PI / 2;
          const x = center + radius * Math.cos(angle);
          const y = center + radius * Math.sin(angle);
          return {
            name: names[index],
            index,
            angle,
            x,
            y,
            order: position + 1,
          };
        });

        const nodeLookup = new Map(nodes.map((node) => [node.index, node]));

        ctx.save();
        ctx.strokeStyle = "rgba(248, 113, 113, 0.28)";
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 14]);
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        const connections = nodes.map((node) => ({
          from: node,
          to: nodeLookup.get(mapping[node.index]),
        }));

        connections.forEach(({ from, to }) =>
          drawArrow(ctx, from, to, { nodeRadius })
        );
        drawNodes(ctx, nodes, { nodeRadius });

        diagramSection.hidden = false;
        latestDiagramDataUrl = diagramCanvas.toDataURL("image/png");
        downloadButton.disabled = false;
        exportButton.disabled = false;
      }

      function showError(text) {
        message.innerHTML = "";
        if (!text) return;

        const error = document.createElement("div");
        error.className = "error";
        error.textContent = text;
        message.appendChild(error);

        resultSection.hidden = true;
        diagramSection.hidden = true;
        downloadButton.disabled = true;
        exportButton.disabled = true;
        latestDiagramDataUrl = "";
        latestPairList = [];
      }

      button.addEventListener("click", () => {
        const names = parseNames(input.value);
        const uniqueNames = unique(names);

        if (uniqueNames.length < 3) {
          showError("请至少输入 3 个不同的姓名，才能生成符合要求的配对。");
          return;
        }

        if (uniqueNames.length !== names.length) {
          showError("检测到重复姓名，请确保每个姓名唯一。");
          return;
        }

        const permutation = generatePermutation(uniqueNames.length);
        const order = getCycleOrder(permutation);
        latestPairList = order.map((sourceIndex, position) => ({
          order: position + 1,
          from: uniqueNames[sourceIndex],
          to: uniqueNames[permutation[sourceIndex]],
        }));
        showError("");
        renderPairs(uniqueNames, permutation, order);
        drawDiagram(uniqueNames, permutation, order);
      });

      downloadButton.addEventListener("click", () => {
        if (!latestDiagramDataUrl) return;
        const link = document.createElement("a");
        link.href = latestDiagramDataUrl;
        link.download = `christmas-pairing-${new Date()
          .toISOString()
          .slice(0, 10)}.png`;
        link.click();
      });

      exportButton.addEventListener("click", () => {
        if (!latestPairList.length) return;
        const header = ["顺序", "送礼人", "收礼人"];
        const rows = latestPairList.map(({ order, from, to }) =>
          [order, from, to].map((value) => `"${String(value).replace(/"/g, '""')}"`).join(",")
        );
        const csvContent = [header.join(","), ...rows].join("\n");
        const blob = new Blob(["\uFEFF" + csvContent], {
          type: "text/csv;charset=utf-8;",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `christmas-pairing-${new Date()
          .toISOString()
          .slice(0, 10)}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      });
    </script>
  </body>
</html>
