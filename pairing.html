<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>随机配对生成器</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 48px 24px;
        background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.18), transparent 45%),
          radial-gradient(circle at 80% 0%, rgba(56, 189, 248, 0.24), transparent 50%),
          linear-gradient(135deg, #eef2ff 0%, #f8fafc 40%, #f0f9ff 100%);
        color: #0f172a;
      }

      .card {
        width: min(960px, 100%);
        background: rgba(255, 255, 255, 0.92);
        border-radius: 28px;
        padding: 36px;
        box-shadow: 0 40px 80px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(148, 163, 184, 0.25);
        animation: floatIn 0.5s ease;
      }

      .card__header {
        text-align: center;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #1d4ed8;
      }

      .subtitle {
        margin: 0;
        color: #475569;
        font-size: 1rem;
      }

      label {
        display: block;
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 12px;
      }

      textarea {
        width: 100%;
        min-height: 150px;
        padding: 18px;
        border-radius: 18px;
        border: 1px solid rgba(148, 163, 184, 0.45);
        font-size: 1rem;
        resize: vertical;
        outline: none;
        background: rgba(248, 250, 252, 0.75);
        transition: border 0.2s ease, box-shadow 0.2s ease;
      }

      textarea:focus {
        border-color: rgba(59, 130, 246, 0.7);
        box-shadow: 0 0 0 5px rgba(59, 130, 246, 0.15);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }

      button {
        cursor: pointer;
        border: none;
        border-radius: 999px;
        padding: 14px 26px;
        font-size: 1rem;
        font-weight: 600;
        transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      #generate-button {
        background: linear-gradient(120deg, #2563eb 0%, #1d4ed8 100%);
        color: #fff;
        box-shadow: 0 16px 28px rgba(37, 99, 235, 0.35);
      }

      #generate-button:hover {
        transform: translateY(-1px);
        box-shadow: 0 20px 36px rgba(37, 99, 235, 0.32);
        filter: brightness(1.04);
      }

      #download-button {
        background: rgba(37, 99, 235, 0.12);
        color: #1d4ed8;
        border: 1px solid rgba(37, 99, 235, 0.2);
      }

      #download-button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        box-shadow: none;
      }

      #download-button:not(:disabled):hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 32px rgba(37, 99, 235, 0.25);
      }

      #message {
        margin-top: 20px;
        min-height: 20px;
      }

      .error {
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid rgba(248, 113, 113, 0.35);
        background: rgba(254, 226, 226, 0.8);
        color: #b91c1c;
      }

      .result,
      .diagram {
        margin-top: 36px;
        animation: fadeUp 0.4s ease;
      }

      .result h2,
      .diagram h2 {
        margin: 0 0 18px;
        font-size: 1.25rem;
        color: #0f172a;
        text-align: center;
      }

      .pairs {
        display: grid;
        gap: 14px;
      }

      .pair {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 20px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(239, 246, 255, 0.92), rgba(219, 234, 254, 0.85));
        border: 1px solid rgba(191, 219, 254, 0.6);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .name {
        flex: 1;
        font-weight: 600;
        color: #1e293b;
        text-align: center;
      }

      .arrow {
        font-size: 1.4rem;
        color: #2563eb;
      }

      .diagram canvas {
        display: block;
        width: min(620px, 100%);
        height: auto;
        border-radius: 22px;
        background: rgba(241, 245, 249, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.35);
        box-shadow: 0 24px 48px rgba(30, 64, 175, 0.18);
        margin: 0 auto;
      }

      .diagram__hint {
        margin-top: 14px;
        text-align: center;
        color: #475569;
        font-size: 0.95rem;
      }

      @keyframes floatIn {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 720px) {
        body {
          padding: 32px 16px;
        }

        .card {
          padding: 28px 22px;
          border-radius: 22px;
        }

        .controls {
          flex-direction: column;
          align-items: stretch;
        }

        button {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header class="card__header">
        <h1>随机姓名配对</h1>
        <p class="subtitle">输入姓名后，一键生成不重复的箭头指派图</p>
      </header>

      <section>
        <label for="names-input">参与人员（使用逗号、顿号或换行分隔）</label>
        <textarea
          id="names-input"
          placeholder="例如：小明，小红，小刚，小丽，小强"
        ></textarea>
        <div class="controls">
          <button id="generate-button" type="button" aria-label="生成配对">
            <span>✨ 生成配对</span>
          </button>
          <button id="download-button" type="button" disabled aria-label="下载配对图">
            <span>⬇️ 下载配对图</span>
          </button>
        </div>
      </section>

      <div id="message"></div>

      <section id="result" class="result" hidden aria-live="polite">
        <h2>配对结果</h2>
        <div id="pairs" class="pairs"></div>
      </section>

      <section id="diagram" class="diagram" hidden>
        <h2>可视化箭头图</h2>
        <canvas id="diagram-canvas" width="620" height="620" role="img" aria-label="配对箭头图"></canvas>
        <p class="diagram__hint">支持下载为 PNG 图片，方便分享或打印。</p>
      </section>
    </main>
    <script>
      const input = document.getElementById("names-input");
      const button = document.getElementById("generate-button");
      const downloadButton = document.getElementById("download-button");
      const message = document.getElementById("message");
      const resultSection = document.getElementById("result");
      const pairsContainer = document.getElementById("pairs");
      const diagramSection = document.getElementById("diagram");
      const diagramCanvas = document.getElementById("diagram-canvas");
      let latestDiagramDataUrl = "";

      function parseNames(raw) {
        return raw
          .split(/[\n,，、]+/)
          .map((name) => name.trim())
          .filter(Boolean);
      }

      function unique(names) {
        return Array.from(new Set(names));
      }

      function shuffle(array) {
        const result = array.slice();
        for (let i = result.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      function generatePermutation(size) {
        const order = shuffle([...Array(size).keys()]);
        const mapping = new Array(size);

        for (let i = 0; i < size; i++) {
          const current = order[i];
          const next = order[(i + 1) % size];
          mapping[current] = next;
        }

        return mapping;
      }

      function renderPairs(names, mapping) {
        pairsContainer.innerHTML = "";
        mapping.forEach((targetIndex, sourceIndex) => {
          const pair = document.createElement("div");
          pair.className = "pair";

          const from = document.createElement("span");
          from.className = "name";
          from.textContent = names[sourceIndex];

          const arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.textContent = "→";

          const to = document.createElement("span");
          to.className = "name";
          to.textContent = names[targetIndex];

          pair.appendChild(from);
          pair.appendChild(arrow);
          pair.appendChild(to);
          pairsContainer.appendChild(pair);
        });
        resultSection.hidden = false;
      }

      function prepareCanvas() {
        const ctx = diagramCanvas.getContext("2d");
        const ratio = window.devicePixelRatio || 1;
        const available = Math.min(diagramSection.clientWidth || 620, 620);
        diagramCanvas.style.width = `${available}px`;
        diagramCanvas.style.height = `${available}px`;
        diagramCanvas.width = available * ratio;
        diagramCanvas.height = available * ratio;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        return { ctx, size: available };
      }

      function drawArrow(ctx, from, to, options = {}) {
        const { nodeRadius = 30, color = "#1d4ed8" } = options;
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const distance = Math.hypot(dx, dy);
        const ux = dx / distance;
        const uy = dy / distance;

        const startX = from.x + ux * nodeRadius;
        const startY = from.y + uy * nodeRadius;

        const endX = to.x - ux * nodeRadius * 1.15;
        const endY = to.y - uy * nodeRadius * 1.15;

        ctx.strokeStyle = color;
        ctx.lineWidth = 2.6;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        ctx.fillStyle = color;
        const headLength = 16;
        const baseAngle = Math.atan2(dy, dx);
        const angle1 = baseAngle - Math.PI / 8;
        const angle2 = baseAngle + Math.PI / 8;

        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(
          endX - headLength * Math.cos(angle1),
          endY - headLength * Math.sin(angle1)
        );
        ctx.lineTo(
          endX - headLength * Math.cos(angle2),
          endY - headLength * Math.sin(angle2)
        );
        ctx.closePath();
        ctx.fill();
      }

      function drawNodes(ctx, nodes, options = {}) {
        const {
          nodeRadius = 30,
          fillColors = ["#dbeafe", "#eff6ff"],
          borderColor = "rgba(37, 99, 235, 0.35)",
        } = options;

        nodes.forEach((node) => {
          const gradient = ctx.createRadialGradient(
            node.x - 10,
            node.y - 12,
            8,
            node.x,
            node.y,
            nodeRadius * 1.15
          );
          gradient.addColorStop(0, fillColors[0]);
          gradient.addColorStop(1, fillColors[1]);

          ctx.beginPath();
          ctx.fillStyle = gradient;
          ctx.arc(node.x, node.y, nodeRadius, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = borderColor;
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = "#0f172a";
          const baseFontSize = node.name.length > 6 ? 14 : 16;
          ctx.font = `600 ${baseFontSize}px "Inter", "Noto Sans SC", system-ui`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(node.name, node.x, node.y);
        });
      }

      function drawDiagram(names, mapping) {
        const { ctx, size } = prepareCanvas();
        const center = size / 2;
        const radius = size / 2 - 80;
        const nodeRadius = Math.max(24, Math.min(32, size / 20));

        const bgGradient = ctx.createLinearGradient(0, 0, size, size);
        bgGradient.addColorStop(0, "#eef2ff");
        bgGradient.addColorStop(1, "#e0f2fe");
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, size, size);

        const nodes = names.map((name, index) => {
          const angle = (Math.PI * 2 * index) / names.length - Math.PI / 2;
          return {
            name,
            x: center + radius * Math.cos(angle),
            y: center + radius * Math.sin(angle),
            index,
          };
        });

        const connections = nodes.map((node, index) => ({
          from: node,
          to: nodes[mapping[index]],
        }));

        connections.forEach(({ from, to }) =>
          drawArrow(ctx, from, to, { nodeRadius })
        );
        drawNodes(ctx, nodes, { nodeRadius });

        diagramSection.hidden = false;
        latestDiagramDataUrl = diagramCanvas.toDataURL("image/png");
        downloadButton.disabled = false;
      }

      function showError(text) {
        message.innerHTML = "";
        if (!text) return;

        const error = document.createElement("div");
        error.className = "error";
        error.textContent = text;
        message.appendChild(error);

        resultSection.hidden = true;
        diagramSection.hidden = true;
        downloadButton.disabled = true;
        latestDiagramDataUrl = "";
      }

      button.addEventListener("click", () => {
        const names = parseNames(input.value);
        const uniqueNames = unique(names);

        if (uniqueNames.length < 3) {
          showError("请至少输入 3 个不同的姓名，才能生成符合要求的配对。");
          return;
        }

        if (uniqueNames.length !== names.length) {
          showError("检测到重复姓名，请确保每个姓名唯一。");
          return;
        }

        const permutation = generatePermutation(uniqueNames.length);
        showError("");
        renderPairs(uniqueNames, permutation);
        drawDiagram(uniqueNames, permutation);
      });

      downloadButton.addEventListener("click", () => {
        if (!latestDiagramDataUrl) return;
        const link = document.createElement("a");
        link.href = latestDiagramDataUrl;
        link.download = `pairing-${new Date()
          .toISOString()
          .slice(0, 10)}.png`;
        link.click();
      });
    </script>
  </body>
</html>
